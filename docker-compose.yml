version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: boramarka-postgres
    restart: always
    environment:
      POSTGRES_DB: boramarka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: boramarka-backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/boramarka?schema=public"
      JWT_SECRET: "desenvolvimento-local-secret-key"
      SUPERADMIN_PASSWORD: "admin"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
