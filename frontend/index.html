<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BoraMarka — Plataforma de agendamento online, cobrança antecipada via Mercado Pago, gestão de equipe, cartão fidelidade e muito mais. Sua agenda cheia, sem complicação." />
    <meta name="theme-color" content="#ec4899" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BoraMarka" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boramarka.com.br/" />
    <meta property="og:title" content="BoraMarka — Sua agenda cheia, sem complicação" />
    <meta property="og:description" content="Agendamento online 24/7, cobrança via Mercado Pago, gestão de equipe, cartão fidelidade digital. Teste grátis por 7 dias!" />
    <meta property="og:image" content="https://boramarka.com.br/assets/og-cover.png" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="BoraMarka" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BoraMarka — Sua agenda cheia, sem complicação" />
    <meta name="twitter:description" content="Agendamento online 24/7, cobrança via Mercado Pago, gestão de equipe. Teste grátis por 7 dias!" />
    <meta name="twitter:image" content="https://boramarka.com.br/assets/og-cover.png" />

    <!-- Additional SEO -->
    <meta name="robots" content="index, follow" />
    <meta name="author" content="BoraMarka" />
    <link rel="canonical" href="https://boramarka.com.br/" />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>BoraMarka — Agendamento Online & Gestão Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      if (localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
        if (!localStorage.getItem('theme')) {
          localStorage.setItem('theme', 'dark');
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
